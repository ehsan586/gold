.btn.go{border-color:rgba(40,224,138,.5)}.btn.wa{border-color:rgba(255,176,32,.5)}.btn.dg{background:rgba(160,20,50,.45);border-color:rgba(255,77,109,.6)}

table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 5px;border-bottom:1px solid rgba(70,120,220,.16);text-align:left;vertical-align:top}th{color:#9db0d4;font-weight:600}
.scroll{overflow-x:auto}pre{white-space:pre-wrap;margin:0;font:11.5px/1.4 ui-monospace,Consolas,monospace}
input,select{width:100%;padding:9px;border-radius:7px;border:1px solid var(--bd);background:rgba(8,18,46,.9);color:var(--tx);font:inherit}
.login{max-width:380px;margin:18vh auto;position:relative;z-index:2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}.modal .panel{max-width:560px;width:100%}
.hud{position:absolute;right:8px;top:30px;opacity:.9}

 #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:6px}nav a{padding:8px 11px;white-space:nowrap}nav hr{display:none}
 .ov{grid-template-columns:1fr;grid-template-areas:"agents" "heroA" "sys" "pos" "mo" "rg" "fc" "dec" "risk" "mods" "log"}#heroP{grid-area:heroA;min-height:380px}
 #bottom{grid-template-columns:1fr 1fr}.mgrid{grid-template-columns:repeat(3,1fr)}header{grid-template-columns:1fr;gap:6px;text-align:center}.brand,.hr{justify-content:center}.ctr:before,.ctr:after{display:none}
}
@media(max-width:700px){.agrid{grid-template-columns:repeat(3,1fr)}#bottom{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(2,1fr)}.brand b{font-size:19px}}

</style></head><body>
<canvas id="stars"></canvas><div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
class Raw{constructor(s){this.s=s}}const raw=s=>new Raw(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const T=(s,...v)=>s.reduce((a,x,i)=>a+x+(i<v.length?(v[i] instanceof Raw?v[i].s:esc(v[i])):""),"");
const J=a=>raw(a.map(x=>x instanceof Raw?x.s:esc(x)).join(""));
const f=(v,d=2)=>(v==null||isNaN(v))?"—":Number(v).toFixed(d);
const money=(v,c)=>v==null?"—":(v<0?"-":"")+Math.abs(v).toFixed(2)+(c?" "+c:"");
const hhmm=t=>{if(t==null)return"—";const d=typeof t==="string"?new Date(t):new Date(t*1000);return isNaN(d)?"—":d.toISOString().slice(11,16)};
const ago=t=>t==null?"—":Math.max(0,Math.round(Date.now()/1000-t))+"s";
const dc=s=>({BUY:"g",UP:"g",BULLISH:"g",SELL:"r",DOWN:"r",BEARISH:"r"}[s]||"m");
const sc=s=>({OK:"g",HEALTHY:"g",READY:"g",Healthy:"g",Safe:"g",Pass:"g",Online:"g",WARN:"a",DEGRADED:"a",Evaluating:"a",FAIL:"r",Block:"r",NOT_READY:"r",NA:"m"}[s]||"m");
let tick=0,token=localStorage.getItem("gb_token")||"",page="Overview",snap=null,cache={},tf="M5",ind=false,tools=true,cacheHTML={},online=false,lastOK=0,pageHtml="";
const rid=()=>crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2,12));
async function api(path,opt={}){
  const r=await fetch(path,{...opt,headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"}});
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401){throw new Error("unauthorized")}
  return {status:r.status,body:j};
}
async function post(path,body={},confirmText){
  if(confirmText&&!confirm(confirmText))return;
  const r=await api(path,{method:"POST",body:JSON.stringify({request_id:rid(),...body})});
  alert(r.status===200?"Done":"Refused: "+((r.body&&r.body.error)||JSON.stringify(r.body)));poll(true);
}
const ctl=(n,b,c)=>post("/api/v1/control/"+n,b||{},c);
/* ---------------- icons ---------------- */
const ICON={Overview:"M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10",Agents:"M12 12a3 3 0 100-6 3 3 0 000 6zM5 20a7 7 0 0114 0M4 10a2 2 0 100-4 2 2 0 000 4zM20 10a2 2 0 100-4 2 2 0 000 4z",
 Market:"M4 20V10M10 20V4M16 20v-8M22 20H2",Analysis:"M3 3v18h18M7 15l4-5 3 3 5-7",Memory:"M12 3l9 4-9 4-9-4 9-4zM3 12l9 4 9-4M3 17l9 4 9-4",Replay:"M3 12a9 9 0 109-9M3 4v5h5M12 8v5l3 2",
 Learning:"M12 2a7 7 0 00-4 12.7V18h8v-3.3A7 7 0 0012 2zM9 21h6",Experiments:"M9 3h6M10 3v6L4 20h16L14 9V3",Settings:"M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-2-4-2 1-2-1V5H9v2L7 8 5 7 3 11l2 1v2l-2 1 2 4 2-1 2 1v2h6v-2l2-1 2 1 2-4-2-1z",
 Trades:"M3 17l6-6 4 4 8-8M15 7h6v6",Risk:"M12 3l9 16H3L12 3zM12 10v4M12 17v.5",Logs:"M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"};
const ico=n=>T`<svg viewBox="0 0 24 24"><path d="${ICON[n]}"/></svg>`;
const ACC={trend:"#3b82ff",structure:"#8b5cf6",price_action:"#ffb020",momentum:"#4fa8ff",volatility:"#28e08a",liquidity:"#7c6cff",news:"#ff9f43",regime:"#2de0a0",forecast:"#ff4f9a"};
const GLY={trend:"M12 40l9-10 6 5 12-17M33 18h6v6",structure:"M14 38l6-14 8 8 10-16M14 38a2 2 0 100 .1M20 24a2 2 0 100 .1M28 32a2 2 0 100 .1M38 16a2 2 0 100 .1",
 price_action:"M20 20v-6M20 36v6M17 20h6v16h-6zM34 14v6M34 38v6M31 20h6v18h-6z",momentum:"M12 32q5-18 10 0t10 0t8-6",volatility:"M16 40V30M23 40V20M30 40V26M37 40V14",
 liquidity:"M28 14c8 10 12 15 12 21a12 12 0 01-24 0c0-6 4-11 12-21z",news:"M15 16h22v24H15zM19 22h14M19 27h14M19 32h8",regime:"M28 14a14 14 0 100 28 14 14 0 000-28zM14 28h28M28 14c-8 8-8 20 0 28M28 14c8 8 8 20 0 28",
 forecast:"M28 14a14 14 0 100 28 14 14 0 000-28zM28 22a6 6 0 100 12 6 6 0 000-12zM28 10v8M28 38v8M10 28h8M38 28h8"};
const hexIcon=k=>{const a=ACC[k]||"#4fd8ff";return T`<svg viewBox="0 0 56 64" style="--ac:${a}"><defs><linearGradient id="hg${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}" stop-opacity=".30"/><stop offset="1" stop-color="#050a20" stop-opacity=".9"/></linearGradient></defs><path d="M28 3L52 17V47L28 61L4 47V17Z" fill="url(#hg${k})" stroke="${a}" stroke-width="1.6"/><path d="${GLY[k]}" fill="none" stroke="${a}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)"/></svg>`};
/* ---------------- shell ---------------- */
const NAV=["Overview","Agents","Market","Analysis","Memory","Replay","Learning","Experiments","Settings","-","Trades","Risk","Logs"];
function boot(){
  if(!token){$("#app").innerHTML=T`<div class="panel login"><div class="pt"><span>ASTRA TRADER</span></div><p class="m">AI • ANALYSIS • RESEARCH<br>Enter your personal ASTRA token once. It stays on this device until you remove it.</p><input id="tk" type="password" placeholder="API token" autocomplete="current-password"><br><br><button class="btn go" onclick="connectToken()">CONNECT</button><div id="authmsg" class="m" style="margin-top:12px"></div></div>`;return}
  $("#app").innerHTML=T`<header><div class="brand"><svg width="44" height="44" viewBox="0 0 48 48"><path d="M24 3L44 42H4Z" fill="none" stroke="#4fd8ff" stroke-width="2.4"/><path d="M24 14l5 12h-10z" fill="#4fd8ff" opacity=".85"/><circle cx="24" cy="31" r="2.4" fill="#fff"/></svg><div><b>ASTRA TRADER</b><small>AI • ANALYSIS • RESEARCH</small></div></div><div class="ctr"><b>MISSION CONTROL</b><small>ANALYZE › PREDICT › EVALUATE</small></div><div class="hr"><span id="emode"></span><span class="live"><i class="dot" id="ldot"></i><span id="ltxt">LIVE</span></span><span id="clk" class="sm"></span><span class="tag">Smarter Decisions<br>Brighter Future</span></div></header><nav id="nav"></nav><main id="main"></main><footer><span id="fv">ASTRA TRADER</span><span>Research &amp; simulation system · demo only · no profit guarantee</span><span><i class="dot" id="fdot"></i> <span id="ftx">connecting…</span></span></footer>`;
  paintNav();setPage(page);poll(true);
}
function connectToken(){
  const v=document.getElementById("tk").value.trim();
  const msg=document.getElementById("authmsg");
  if(v.length<16){msg.textContent="Token must be at least 16 characters.";return}
  msg.textContent="Connecting…";
  fetch("/api/v1/health",{headers:{Authorization:"Bearer "+v}}).then(async r=>{
    if(r.ok){localStorage.setItem("gb_token",v);token=v;boot();return}
    msg.textContent="This token is not the token configured for this ASTRA installation. Use the token from ASTRA_API_TOKEN.txt.";
  }).catch(()=>{msg.textContent="ASTRA is not reachable yet. Start the program and try again."});
}
function paintNav(){$("#nav").innerHTML=NAV.map(n=>n==="-"?"<hr>":T`<a class="${n===page?"on":""}" onclick="setPage('${n}')">${raw(ico(n))}<span>${n}</span></a>`).join("")}
function setPage(p){page=p;pageHtml="";cacheHTML={};paintNav();const m=$("#main");m.innerHTML="";if(p==="Overview"){m.innerHTML=OV;initCanvases()}loadPage().then(paint)}
function paintHeader(){
  const em=snap&&snap.execution_mode,col={SIMULATION:"#ffb020",DISABLED:"#8da0c4",MT5_DEMO:"#ff4d6d"}[em]||"#8da0c4";
  $("#emode").innerHTML=T`<span class="emode" style="color:${col};border-color:${col}" title="Final build is simulation-only; no real orders are sent">EXECUTION: ${em||"—"}</span>`;
  const stale=snap&&snap.health&&snap.health.status==="DEGRADED";
  $("#ldot").className="dot"+(!online?" off":stale?" wa":"");$("#ltxt").textContent=!online?"OFFLINE":stale?"DEGRADED":"LIVE";
  const n=new Date();$("#clk").innerHTML=T`${n.toLocaleTimeString([], {hour12:false})}<br><span class="m">${n.toISOString().slice(0,10)}</span>`;
  $("#fv").textContent="ASTRA TRADER v"+((snap&&snap.app_version)||"");$("#fdot").className="dot"+(online?"":" off");$("#ftx").textContent=online?"System Online":"Offline";
}
/* ---------------- polling ---------------- */
async function poll(force){
  try{const r=await api("/api/v1/snapshot");if(r.status===200&&r.body&&r.body.state){snap=r.body;online=true;lastOK=Date.now()}else online=false;
    if(page==="Overview"||force){const c=await api("/api/v1/candles?tf="+tf+"&limit=120");if(c.body&&c.body.candles)cache.candles=c.body.candles}
    if(force||(++tick%3===0))await loadPage()}catch(e){online=false}
  paint();
}
async function loadPage(){
  const g=async p=>{try{return (await api(p)).body}catch(e){return null}};
  if(page==="Memory"){cache.exp=await g("/api/v1/experiences?limit=15");cache.ev=await g("/api/v1/events?limit=30")}
  if(page==="Replay")cache.replay=await g("/api/v1/replay");
  if(page==="Learning"){cache.learn=await g("/api/v1/learning");cache.models=await g("/api/v1/models");cache.fc=await g("/api/v1/forecasts");cache.drift=await g("/api/v1/drift")}
  if(page==="Analysis")cache.fc=await g("/api/v1/forecasts");
  if(page==="Experiments")cache.expr=await g("/api/v1/experiments");
  if(page==="Settings"){cache.cfg=await g("/api/v1/config");cache.units=await g("/api/v1/units")}
  if(page==="Trades"){cache.open=await g("/api/v1/trades?status=OPEN");cache.closed=await g("/api/v1/trades?status=CLOSED&limit=60")}
  if(page==="Risk")cache.rev=await g("/api/v1/risk_events?limit=15");
  if(page==="Logs")cache.logs=await g("/api/v1/logs?limit=150"+(cache.lvl?"&level="+cache.lvl:""));
  if(page==="Market"||page==="Overview"){const c=await g("/api/v1/candles?tf="+tf+"&limit=120");if(c&&c.candles)cache.candles=c.candles}
}
function paint(){
  paintHeader();const m=$("#main");if(!m)return;
  if(!snap||!snap.state){if(page!=="Overview")m.innerHTML=T`<div class="panel">Waiting for the engine…</div>`;return}
  if(page==="Overview")return paintOverview();
  const h=(PAGES[page]||(()=>""))();if(h!==pageHtml){pageHtml=h;m.innerHTML=h}afterPage();
}
/* ---------------- candles ---------------- */
function emaArr(a,n){const k=2/(n+1);const o=[a[0]];for(let i=1;i<a.length;i++)o.push(o[i-1]+k*(a[i]-o[i-1]));return o}
function drawCandles(cv,cs,o={}){

  if(!cs||!cs.length){g.fillStyle="#7f93b8";g.font="12px sans-serif";g.fillText("no candle data yet",10,20);return}
  const padR=o.axis?48:4,padB=o.volume?Math.round(h*.2):4,pw=w-padR,ph=h-padB-4;
  let lo=Math.min(...cs.map(c=>c[3])),hi=Math.max(...cs.map(c=>c[2]));

  const vmax=Math.max(...cs.map(c=>c[5]||0))||1;
  cs.forEach((c,i)=>{const x=i*cw+cw/2,up=c[4]>=c[1],col=up?"#28e08a":"#ff4d6d";
    if(o.volume){g.fillStyle=up?"rgba(40,224,138,.35)":"rgba(255,77,109,.35)";const vh=(c[5]||0)/vmax*(padB-4);g.fillRect(x-cw*.31,h-vh,cw*.62,vh)}

    const y1=Y(Math.max(c[1],c[4])),y2=Y(Math.min(c[1],c[4]));g.fillRect(x-cw*.31,y1,Math.max(1,cw*.62),Math.max(1,y2-y1))});
  (o.emas||[]).forEach(e=>{g.strokeStyle=e.c;g.lineWidth=1.3;g.beginPath();e.v.forEach((v,i)=>{const x=i*cw+cw/2;i?g.lineTo(x,Y(v)):g.moveTo(x,Y(v))});g.stroke()});
  lines.forEach(l=>{g.strokeStyle=l.c;g.setLineDash(l.d||[4,3]);g.lineWidth=1;g.beginPath();g.moveTo(0,Y(l.y));g.lineTo(pw,Y(l.y));g.stroke();g.setLineDash([]);g.fillStyle=l.c;g.font="10px sans-serif";g.fillText(l.t+" "+l.y.toFixed(2),4,Y(l.y)-2)});
}

Memory(){const e=cache.exp||{},sm=e.summary||{},ev=cache.ev||[];
 return grid([pn("Experience memory",RH("Experiences",sm.experiences??"—")+RH("Resolved with outcome",sm.resolved??"—")+RH("Raw events (audit trail)",sm.raw_events??"—")+tb(["Regime","n","resolved","avg error"],(sm.by_regime||[]).map(r=>[r.regime,r.n,r.resolved,r.avg_err==null?"—":f(r.avg_err,3)]))+`<button class="btn" onclick="verifyChain()">Verify audit chain (hash chain)</button>`),
  pn("Recent experiences",tb(["Time","Regime","Uncertainty","Decision","Error"],(e.recent||[]).map(r=>[String(r.ts).slice(11,19),r.regime,r.uncertainty,r.decision,r.prediction_error==null?"pending":f(r.prediction_error,0)]))),
  pn("Raw event log",`<div class="mlog" style="max-height:340px">${ev.map(x=>T`<div><span class="t">${String(x.ts).slice(11,19)}</span><span class="c">${x.event_type}</span><span class="m">${String(x.payload_json).slice(0,90)}</span></div>`).join("")}</div>`)])},
Replay(){const r=cache.replay||{},t=r.selftest;
 return grid([pn("Replay engine",RH("Self-test",t?(t.ok?"PASSED":"FAILED"):"not run",t?(t.ok?"g":"r"):"m")+(t?RH("Deterministic",String(t.deterministic))+RH("Look-ahead violations",t.leak_violations)+RH("Events / digest",(t.events||"—")+" / "+(t.digest||"—")):"")+`<button class="btn" onclick="selftest()">Run self-test now</button><p class="sm m">The self-test replays a small synthetic history twice through the real engine, compares the hash-chained event digests (determinism) and counts any access to data newer than the replay clock (look-ahead).</p>`),
  pn("Replay history from MT5 data",`<pre>python -m goldbot replay --csv XAUUSD_M1.csv --verify
python -m goldbot replay --csv XAUUSD_M1.csv
python -m goldbot reconstruct --csv XAUUSD_M1.csv --index 25000</pre><p class="sm m">Replay reconstructs what the system knew at each point in time (data, agents, forecast, consistency, decision, validation, simulated result). Long replays run from the command line.</p>`)])},
Learning(){const L=cache.learn||{},M=cache.models||{},F=cache.fc||{},D=cache.drift||{},ap=L.agent_performance||{},ev=M.last_evaluation||{};
 const mrows=(M.models||[]).map(m=>[m.model_id,m.version,raw(T`<span class="badge ${m.status==="CHAMPION"?"bg":m.status==="CHALLENGER"||m.status==="VALIDATED"?"ba":m.status==="REJECTED"?"br":"bm"}">${m.status}</span>`),m.feature_version,m.train_dataset_ref||"—",raw(m.status==="VALIDATED"?T`<a style="cursor:pointer" class="g" onclick="promoteM('${m.model_id}','${m.version}')">promote…</a> · <a style="cursor:pointer" class="r" onclick="rejectM('${m.model_id}','${m.version}')">reject</a>`:m.status==="CHAMPION"?T`<a style="cursor:pointer" class="a" onclick="rollbackM('${m.model_id}')">rollback…</a>`:"")]);
 return grid([pn("Lifecycle",`<p class="sm">data → experience memory → evaluation → drift detection → candidate → <b>offline replay + out-of-sample</b> → <b>shadow</b> next to champion → validated → <b>human approval</b> | rejected. The previous champion is always kept as STABLE.</p>`+RH("Active strategy version",L.active_version||"—")+RH("Learning samples",(L.samples??"—")+" / min "+(L.min_samples??"—"))+(L.note?`<div class="a sm">${esc(L.note)}</div>`:"")+`<button class="btn" onclick="evalNow()">Evaluate now</button><button class="btn" onclick="propose()">Generate weight proposal (draft only)</button><button class="btn" onclick="post('/api/v1/control/reload-strategy',{},'Load the ACTIVE strategy version now?')">Reload active strategy</button>`),
  pn("Models: champion / challenger",tb(["Model","Version","Status","Feature v.","Training data","Action"],mrows)+`<p class="sm m">New challengers are created from the command line (they need historical data for the offline replay + out-of-sample stage): <code>python -m goldbot challenger --csv XAUUSD_M1.csv</code></p>`),
  pn("Drift",((D.flags||[]).length?tb(["Kind","Name","Severity","Value","Threshold"],(D.flags||[]).map(x=>[x.kind,x.name,raw(T`<span class="${x.severity==="HIGH"?"r":"a"}">${x.severity}</span>`),x.value,x.threshold])):`<div class="g">no drift flagged</div>`)+`<p class="sm m">Window ${D.window||"—"} bars; needs ${2*(D.window||0)} bars before the first comparison. A drift flag triggers evaluation, never automatic retraining.</p>`),
  pn("Forecast scoreboard",tb(["Model","Role","n","Accuracy","Verdict"],(F.scoreboard||[]).map(b=>[b.model+" v"+b.version,b.role,b.n,b.accuracy==null?"—":f(b.accuracy*100,1)+"%",b.verdict]))+RH("Calibration",((F.calibration||{}).status)||"—")+RH("ECE / Brier",(((F.calibration||{}).ece)??"—")+" / "+(((F.calibration||{}).brier)??"—"))),
  pn("Shadow evaluation of challengers",tb(["Version","Paired n","z","Decision"],(ev.challengers||[]).map(c=>[c.version,c.paired_samples,c.z,c.decision]))),
  pn("Agent performance (needs enough samples)",tb(["Agent","n","Accuracy","Win%","Avg R","Enough data"],Object.entries(ap).map(([k,v])=>[k,v.n,f(v.accuracy*100,0)+"%",f(v.win_rate*100,0)+"%",v.avg_r,v.sufficient_sample?"yes":"no"])))])},
Experiments(){const r=cache.expr||[];
 return grid([pn("Experiment lab",tb(["ID","When","Hypothesis","Status","Code","Data","Outcome"],r.map(e=>[e.experiment_id,String(e.created_ts).slice(0,16),e.hypothesis,e.status,e.code_version,e.data_version,(e.outcome||"").slice(0,70)]))),
  pn("Ablation testing",`<pre>python -m goldbot ablation --csv XAUUSD_M1.csv</pre><p class="sm">Runs FULL vs WITHOUT_TREND / STRUCTURE / PRICE_ACTION / MOMENTUM / VOLATILITY / LIQUIDITY / NEWS / FORECAST / REGIME on the <b>out-of-sample</b> segment and reports each component's incremental contribution with a significance test.</p><p class="sm m">A holdout guard refuses to reuse the same evaluation set more than ${esc(String((cache.cfg||{}).max_eval_reuse??3))} times: repeated tuning on one set silently overfits it.</p>`)])},
Settings(){const c=cache.cfg||{},u=cache.units||{},em=snap.execution_mode;
 return grid([pn("Execution",RH("Mode",em,"a")+`<p class="sm">${esc({SIMULATION:"Live data, VIRTUAL account. No real order is ever sent.",DISABLED:"Analysis only. Nothing is executed, not even virtually.",MT5_DEMO:"Blocked in final safety-first build."}[em]||"")}</p><p class="sm m">The final launcher uses SIMULATION by design. It cannot be changed from the dashboard.</p>`+RH("Real accounts","forbidden","g")),
  pn("Configuration (secrets are never sent)",tb(["Setting","Value"],Object.entries(c).map(([k,v])=>[k,Array.isArray(v)?v.join(","):String(v)]))),
  pn("Instrument units",RH("Currency / money",(u.account_currency||"—")+" / "+(u.denomination||"—"))+RH("Symbol",u.symbol||"—")+RH("Tick size / value",(u.tick_size??"—")+" / "+(u.tick_value??"—"))+RH("Contract / digits",(u.contract_size??"—")+" / "+(u.digits??"—")))])},
Trades(){const t=x=>tb(["#","Side","Lot","Entry","Exit","P/L","R","Min","Exit reason"],(x||[]).map(r=>[r.id,raw(T`<span class="${dc(r.direction)}">${r.direction}</span>`),r.lot,r.entry_price,r.exit_price??"—",raw(T`<span class="${cl(r.pnl)}">${r.pnl==null?"—":f(r.pnl)}</span>`),r.r_multiple??"—",r.duration_sec?(r.duration_sec/60).toFixed(0):"—",r.exit_reason||""]));
 return grid([pn("Open trades",t(cache.open)),pn("Closed trades",t(cache.closed))])},
Risk(){const r=snap.risk;if(!r)return pn("Risk","<div class=m>No data yet</div>");const L=r.limits,m=(t,v,l,u)=>pn(t,T`<div class="big">${v}${u} / ${l}${u}</div><div class="bar"><i style="width:${Math.min(100,v/l*100)}%;background:${v/l>.8?"#ff4d6d":"linear-gradient(90deg,#14b87a,#35f0a0)"}"></i></div>`);
 return grid([m("Exposure",r.exposure_pct,L.max_total_exposure,"%"),m("Daily loss",r.daily_loss_pct,L.max_daily_loss,"%"),m("Drawdown",r.drawdown_pct,L.max_account_drawdown,"%"),m("Consecutive losses",r.consecutive_losses,L.max_consecutive_losses,""),m("Trades today",r.trades_today,L.max_trades_per_day,""),m("Reversals today",r.reversals_today,L.max_reversals_per_day,""),
  pn("Account",RH("Margin used",f(r.margin))+RH("Margin level",r.margin_level+"%")+RH("Leverage","1:"+r.leverage)+RH("Max risk / trade",L.max_risk_per_trade+"%")+RH("Spread (pts)",r.spread_points)),pn("Recent risk blocks",`<pre>${esc((cache.rev||[]).map(x=>`${x.ts.slice(11,19)} ${x.level} ${x.message}`).join("\n")||"none")}</pre>`)])},
Logs(){const sel=`<select onchange="cache.lvl=this.value;loadPage().then(paint)">${["","INFO","WARN","ERROR","CRITICAL"].map(x=>`<option value="${x}" ${x===(cache.lvl||"")?"selected":""}>${x||"all levels"}</option>`).join("")}</select>`;
 return sel+"<br><br>"+pn("System log",`<pre>${esc((cache.logs||[]).map(x=>`${String(x.ts).slice(11,19)} ${x.level.padEnd(8)} ${x.component}/${x.event}: ${x.message}`).join("\n\n")||"…")}</pre>`)}
};
function afterPage(){if(page==="Market"){const cs=cache.candles||[];drawCandles(document.getElementById("mcv2"),cs,{axis:true,volume:true,emas:ind?[{v:emaArr(cs.map(x=>x[4]),20),c:"#ffb020"},{v:emaArr(cs.map(x=>x[4]),50),c:"#8b5cf6"}]:[],lines:chartLines()})}}
const ask=(q)=>prompt(q);
async function evalNow(){await post("/api/v1/learning/evaluate");loadPage().then(paint)}
async function propose(){const r=await api("/api/v1/learning/propose",{method:"POST",body:JSON.stringify({request_id:rid()})});alert(JSON.stringify((r.body&&(r.body.proposal||r.body.note))||r.body));loadPage().then(paint)}
async function promoteM(m,v){const a=ask("Approver name (required)"),e=a&&ask("Evidence / why (required)");if(!a||!e)return;await post("/api/v1/models/promote",{model_id:m,version:v,approver:a,evidence:e},"Promote "+m+" v"+v+" to CHAMPION? The old champion stays as STABLE.");loadPage().then(paint)}
async function rejectM(m,v){const r=ask("Reason");if(!r)return;await post("/api/v1/models/reject",{model_id:m,version:v,reason:r});loadPage().then(paint)}
async function rollbackM(m){const r=ask("Reason for rollback");if(!r)return;await post("/api/v1/models/rollback",{model_id:m,reason:r},"Roll "+m+" back to the last STABLE version?");loadPage().then(paint)}
async function verifyChain(){const r=await api("/api/v1/events/verify");alert(JSON.stringify(r.body))}
async function selftest(){const r=await api("/api/v1/replay/selftest",{method:"POST",body:JSON.stringify({request_id:rid()})});alert(JSON.stringify(r.body));loadPage().then(paint)}
boot();setInterval(poll,2000);setInterval(()=>{if(token)paintHeader()},1000);
addEventListener("resize",()=>{if(page==="Overview"){const k=document.getElementById("cock");if(k)drawCockpit(k)}});
</script></body></html>
